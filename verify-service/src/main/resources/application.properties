spring.application.name=verify-service
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
server.servlet.context-path=/v1/verify
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}?currentSchema=${DATABASE_SCHEMA}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# The below configuration is set for VP request status long polling timeout set with env INJI_VP_REQUEST_LONG_POLLING_TIMEOUT, if not set the default value is 55000ms
inji.vp-request.long-polling-timeout=${INJI_VP_REQUEST_LONG_POLLING_TIMEOUT:55000}

# The root url for the VP submission service, used to submit VP requests
inji.vp-submission.base-url=${INJI_VP_SUBMISSION_BASE_URL:https://injiverify.dev.mosip.net/v1/verify}

# The keystore file path and password for signing the VP requests send via request_uri
inji.keystore.file.path=classpath:sample-keystore/test.p12
inji.keystore.file.pass=${INJI_KEYSTORE_FILE_PASS:mosip}

# The DID issuer URI and public key URI for the service if the DID document is hosted
inji.did.verify.uri=${INJI_DID_VERIFY_URI:did:web:injiverify.dev.mosip.net:v1:verify}
inji.did.verify.public.key.uri=${INJI_DID_VERIFY_PUBLIC_KEY_URI:did:web:injiverify.dev.mosip.net:v1:verify#key-0}

inji.verify.redirect-uri=${INJI_VERIFY_REDIRECT_URI:}

inji.verify.claims-with-meta-data=${INJI_VERIFY_CLAIMS_WITH_META_DATA:_sd,_sd_alg,iss,cnf,sub,aud,exp,nbf,iat,cti}

# ---- Issuer details verification (see docs/issuer-verification) ----
# Disabled by default: when false, no issuer-verification beans are created and /vc-verification is unchanged.
inji.verify.issuer-verification.enabled=${INJI_VERIFY_ISSUER_VERIFICATION_ENABLED:false}
# Run for every request unless the request sets verifyIssuer explicitly.
inji.verify.issuer-verification.run-by-default=${INJI_VERIFY_ISSUER_VERIFICATION_RUN_BY_DEFAULT:true}
# true: issuer not TRUSTED => allChecksSuccessful=false. false: issuer result is advisory (reported separately).
inji.verify.issuer-verification.enforce=${INJI_VERIFY_ISSUER_VERIFICATION_ENFORCE:false}
# A = registry strict, B = DID cryptographic only, C = approved trust framework,
# D = registered + authorised for the credential type only (use with type=trqp), or a custom policy name.
inji.verify.issuer-verification.active-policy=${INJI_VERIFY_ISSUER_VERIFICATION_POLICY:A}
inji.verify.issuer-verification.approved-trust-frameworks=${INJI_VERIFY_ISSUER_VERIFICATION_APPROVED_TRUST_FRAMEWORKS:}
inji.verify.issuer-verification.clock-skew=${INJI_VERIFY_ISSUER_VERIFICATION_CLOCK_SKEW:60s}

# DID resolution (SSRF-guarded). Restrict to the issuer domains you accept in production.
inji.verify.issuer-verification.did.allowed-hosts=${INJI_VERIFY_ISSUER_VERIFICATION_DID_ALLOWED_HOSTS:}
inji.verify.issuer-verification.did.allow-private-hosts=${INJI_VERIFY_ISSUER_VERIFICATION_DID_ALLOW_PRIVATE_HOSTS:false}
inji.verify.issuer-verification.did.connect-timeout=${INJI_VERIFY_ISSUER_VERIFICATION_DID_CONNECT_TIMEOUT:3s}
inji.verify.issuer-verification.did.read-timeout=${INJI_VERIFY_ISSUER_VERIFICATION_DID_READ_TIMEOUT:5s}
inji.verify.issuer-verification.did.cache-ttl=${INJI_VERIFY_ISSUER_VERIFICATION_DID_CACHE_TTL:5m}

# Trust registry: none | static | rest | trqp (ToIP TRQP v2.0 HTTPS binding, e.g. Affinidi trust registry)
inji.verify.issuer-verification.registry.type=${INJI_VERIFY_ISSUER_VERIFICATION_REGISTRY_TYPE:none}
inji.verify.issuer-verification.registry.id=${INJI_VERIFY_ISSUER_VERIFICATION_REGISTRY_ID:default}
inji.verify.issuer-verification.registry.static-file=${INJI_VERIFY_ISSUER_VERIFICATION_REGISTRY_STATIC_FILE:}
inji.verify.issuer-verification.registry.rest-base-url=${INJI_VERIFY_ISSUER_VERIFICATION_REGISTRY_REST_BASE_URL:}
inji.verify.issuer-verification.registry.rest-bearer-token=${INJI_VERIFY_ISSUER_VERIFICATION_REGISTRY_REST_BEARER_TOKEN:}
# type=trqp: rest-base-url is the registry root (POST {base}/authorization); bearer token, if any, is rest-bearer-token.
inji.verify.issuer-verification.registry.trqp-authority-id=${INJI_VERIFY_ISSUER_VERIFICATION_REGISTRY_TRQP_AUTHORITY_ID:}
inji.verify.issuer-verification.registry.trqp-action=${INJI_VERIFY_ISSUER_VERIFICATION_REGISTRY_TRQP_ACTION:issue}
# Registry ports allowed by the SSRF guard (comma separated). A registry on e.g. 3232 must be listed explicitly.
inji.verify.issuer-verification.registry.allowed-ports=${INJI_VERIFY_ISSUER_VERIFICATION_REGISTRY_ALLOWED_PORTS:443}
inji.verify.issuer-verification.registry.allow-private-hosts=${INJI_VERIFY_ISSUER_VERIFICATION_REGISTRY_ALLOW_PRIVATE_HOSTS:false}
inji.verify.issuer-verification.registry.connect-timeout=${INJI_VERIFY_ISSUER_VERIFICATION_REGISTRY_CONNECT_TIMEOUT:3s}
inji.verify.issuer-verification.registry.read-timeout=${INJI_VERIFY_ISSUER_VERIFICATION_REGISTRY_READ_TIMEOUT:5s}
inji.verify.issuer-verification.registry.cache-ttl=${INJI_VERIFY_ISSUER_VERIFICATION_REGISTRY_CACHE_TTL:5m}
inji.verify.issuer-verification.registry.not-found-cache-ttl=${INJI_VERIFY_ISSUER_VERIFICATION_REGISTRY_NOT_FOUND_CACHE_TTL:1m}
inji.verify.issuer-verification.registry.max-metadata-age=${INJI_VERIFY_ISSUER_VERIFICATION_REGISTRY_MAX_METADATA_AGE:0s}
